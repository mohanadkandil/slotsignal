name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked
