[package]
name = "slotsignal"
version = "0.2.0"
edition = "2021"
description = "Telegram alerts for available appointments"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
nix = { version = "0.30", features = ["user", "fs"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "3.5", features = ["json"] }
url = "2"

[profile.release]
lto = true
strip = true
