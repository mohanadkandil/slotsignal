services:
  appointment-alert:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ALERT_DATA_DIR: /data
      ALERT_CHANNELS: telegram
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  monitor-data:
